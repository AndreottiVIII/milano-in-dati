<!doctype html><html lang="it"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:#111;background:#fff}
.A{position:relative;width:1200px;height:630px;padding:56px 64px}
.A .band{position:absolute;left:0;top:0;width:1200px;height:18px;display:flex}
.A .band i{flex:1}
.A .t{font-size:64px;font-weight:800;letter-spacing:-.02em;line-height:1.05;max-width:1000px}
.A .box{display:inline-block;margin-top:34px;padding:14px 26px 10px;font-size:132px;font-weight:900;letter-spacing:-.03em;line-height:1;color:#fff}
.A .p{margin-top:20px;font-size:34px;line-height:1.3;color:#333;max-width:1000px}
.A .ft{position:absolute;left:64px;right:64px;bottom:40px;display:flex;align-items:center;gap:16px;font-size:30px;font-weight:800}
.A .ft span{font-weight:400;color:#555;margin-left:auto;font-size:26px}
.B{width:1200px;height:630px;padding:56px 64px;color:#fff;position:relative}
.B .t{font-size:52px;font-weight:800;opacity:.95}
.B .n{font-size:210px;font-weight:900;letter-spacing:-.04em;line-height:1;margin-top:30px}
.B .p{font-size:34px;line-height:1.3;margin-top:18px;max-width:1000px}
.B .ft{position:absolute;left:64px;right:64px;bottom:40px;display:flex;align-items:center;gap:16px;font-size:30px;font-weight:800}
.B .ft .ic{background:#fff;border-radius:10px;padding:4px;display:flex}
.C{width:1200px;height:630px;display:grid;grid-template-columns:1fr 420px;align-items:center;padding:0 0 0 64px;position:relative}
.C .t{font-size:58px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.C .n{font-size:150px;font-weight:900;letter-spacing:-.03em;line-height:1;margin-top:26px;border-left:16px solid;padding-left:22px}
.C .p{font-size:32px;line-height:1.3;color:#333;margin-top:16px}
.C .ft{position:absolute;left:64px;bottom:36px;font-size:28px;font-weight:800}
.C .side{height:630px;display:flex;align-items:center;justify-content:center;background:#f2f3f5}
</style></head><body><div id="r"></div>
<script>
var Q=new URLSearchParams(location.search),V=Q.get('v')||'A',T=Q.get('t'),N=Q.get('n'),P=Q.get('p'),C=Q.get('c')||'#E30613',TX=Q.get('tx')||'#fff';
var ICO=document.createElement('div');
Promise.resolve(window.FAV).then(function(svg){
 function ic(px){return svg.replace('<svg ','<svg width="'+px+'" height="'+px+'" ')}
 var band='<div class="band">'+['#E30613','#00A651','#FFD500','#0072BC','#7B3FA0'].map(c=>'<i style="background:'+c+'"></i>').join('')+'</div>';
 var h='';
 if(V==='A')h='<div class="A">'+band+'<div class="t">'+T+'</div><div class="box" style="background:'+C+';color:'+TX+'">'+N+'</div><div class="p">'+P+'</div><div class="ft">'+ic(52)+'Milano in dati<span>i numeri della città, con le fonti</span></div></div>';
 if(V==='B')h='<div class="B" style="background:'+C+';color:'+TX+'"><div class="t">'+T+'</div><div class="n">'+N+'</div><div class="p">'+P+'</div><div class="ft"><span class="ic">'+ic(48)+'</span>Milano in dati</div></div>';
 if(V==='C')h='<div class="C"><div><div class="t">'+T+'</div><div class="n" style="border-color:'+C+'">'+N+'</div><div class="p">'+P+'</div></div><div class="side">'+ic(300)+'</div><div class="ft">Milano in dati</div></div>';
 document.getElementById('r').innerHTML=h;document.body.dataset.ok=1;
});
</script></body></html>
