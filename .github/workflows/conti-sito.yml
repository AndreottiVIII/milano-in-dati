name: Conti del sito

# Ricalcola i numeri della pagina "Il sito" (pagine, grafici, numeri, fonti)
# ogni volta che cambia qualcosa in docs/.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'strumenti/conta_sito.py'
      - '!docs/il-sito/data/conti.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conti-sito
  cancel-in-progress: true

jobs:
  conti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ricalcola i conti
        run: python -I -X utf8 strumenti/conta_sito.py
      - name: Salva se sono cambiati
        run: |
          if git diff --quiet -- docs/il-sito/data/conti.json; then
            echo "Nessun cambiamento"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/il-sito/data/conti.json
            git commit -m "Conti del sito aggiornati"
            git push
          fi
